<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<button class="menu-toggle" id="menu-toggle" aria-label="Открыть меню">
  ☰
</button>

<nav class="site-menu" id="site-menu" hidden>
  <a href="index.html">Главная</a>
  <a href="winners-2024.html">Победители 2024 года</a>
  <a href="winners-2025.html">Победители 2025 года</a>
</nav>

<main class="shell">
  <h1>Победители 2024 года</h1>

  <div class="winners-grid">

    <article class="winner-card">
      <img src="photos/lena.jpg" alt="Елена Кузнецова">

      <p>Лучший игрок в Квиз</p>
    </article>

    <article class="winner-card">
      <img src="photos/pasha.jpg" alt="Павел Бояркин">
      <h2>Павел Бояркин</h2>
      <p>Не повезло, не фортануло…</p>

    </article>

  </div>

  <a class="back-home" href="index.html">← Вернуться на главную</a>
</main>

<script>
  const menuToggle = document.getElementById('menu-toggle');
  const siteMenu = document.getElementById('site-menu');

  menuToggle.addEventListener('click', () => {
    siteMenu.hidden = !siteMenu.hidden;
  });

  document.addEventListener('click', (event) => {
    if (!menuToggle.contains(event.target) &&
        !siteMenu.contains(event.target)) {
      siteMenu.hidden = true;
    }
  });
</script>
</body>
